<title>Справочник Moggers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiny5&family=Pixelify+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a dark workbench — section rail on the left, one section at a time on the right,
   item art sits in inventory-style slots; the art carries the colour, the interface stays neutral. */
:root {
  --bg: #161616;
  --panel: #222222;
  --panel-2: #2b2b2b;
  --line: #3f3f3f;
  --fg: #ededed;
  --muted: #a3a3a3;
  --accent: #e8b04a;
  --slot-hi: #555555;
  --slot-lo: #101010;
  --font-display: "Tiny5", "Pixelify Sans", ui-monospace, monospace;
  --font-brand: "Pixelify Sans", "Tiny5", ui-monospace, monospace;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
a { color: inherit; }
.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  background: var(--panel); border-right: 2px solid var(--line);
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 22px; }
.brand b { font: 700 22px/1 var(--font-brand); letter-spacing: .02em; }
.brand small { display: block; font: 13px/1.2 var(--font-display); color: var(--muted); letter-spacing: .04em; margin-top: 3px; }
.mark { width: 30px; height: 30px; background: var(--accent); box-shadow: inset -3px -3px 0 #a87420, inset 3px 3px 0 #f6d58c; image-rendering: pixelated; }
.nav { display: flex; flex-direction: column; gap: 4px; list-style: none; margin: 0; padding: 0; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; text-decoration: none;
  border: 2px solid transparent; color: var(--fg); font: 16px/1.2 var(--font-display); letter-spacing: .03em;
}
.nav a:hover { background: var(--panel-2); }
.nav a[aria-current="page"] { background: var(--panel-2); border-color: var(--accent); }
.nav a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.nav .slot { width: 26px; height: 26px; }
.main { min-width: 0; padding-block: 28px 64px; padding-left: 32px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1040px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: .03em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 4vw, 44px); line-height: 1.05; }
h2 { font-size: 24px; line-height: 1.15; }
h3 { font-size: 19px; line-height: 1.2; }
.eyebrow { font: 13px/1 var(--font-display); color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
.lead { color: var(--muted); max-width: 62ch; margin: 10px 0 0; font-size: 16px; }
.head { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; padding-bottom: 18px; border-bottom: 2px solid var(--line); margin-bottom: 26px; }
.head .titles { min-width: 0; display: grid; gap: 8px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--slot-lo); border: 2px solid var(--line); padding: 6px 10px; min-width: min(280px, 100%); }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--fg); font: 15px var(--font-body); }
.search input:focus { outline: none; }
.search:focus-within { border-color: var(--accent); }
.blocks { display: grid; gap: 34px; }
.block { display: grid; gap: 12px; min-width: 0; }
.block p { margin: 0; max-width: 70ch; }
.block .note { color: var(--muted); font-size: 13px; }
.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; display: grid; gap: 8px; max-width: 76ch; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
.steps li::before {
  content: counter(step); display: grid; place-items: center; height: 30px;
  font: 15px/1 var(--font-display); background: var(--panel-2); border: 2px solid var(--line);
}
.steps li span { padding-top: 4px; }
.slot {
  width: 36px; height: 36px; flex: none; display: grid; place-items: center; background: #8b8b8b10;
  border: 2px solid; border-color: var(--slot-lo) var(--slot-hi) var(--slot-hi) var(--slot-lo); background-color: #1b1b1b;
}
.slot img { width: 80%; height: 80%; image-rendering: pixelated; }
.table-box { overflow-x: auto; border: 2px solid var(--line); background: var(--panel); }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14px; }
th { text-align: left; font: 14px/1.2 var(--font-display); letter-spacing: .05em; color: var(--muted); background: var(--panel-2); padding: 9px 12px; position: sticky; top: 0; }
td { padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
tr:hover td { background: #ffffff06; }
.cellbox { display: flex; gap: 10px; align-items: center; min-width: 0; }
.cellbox .slot { width: 32px; height: 32px; }
.cellnote { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 2px solid var(--line); display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.card figure { margin: 0; background: #121212; border-bottom: 2px solid var(--line); aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden; }
.card figure img { max-width: 92%; max-height: 92%; object-fit: contain; }
.card .body { padding: 12px 14px 14px; display: grid; gap: 6px; align-content: start; }
.card .top { display: flex; gap: 10px; align-items: center; }
.card .sub { font: 13px/1.2 var(--font-display); color: var(--accent); letter-spacing: .05em; }
.card ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; display: grid; gap: 3px; }
.cmds { display: grid; gap: 6px; }
.cmd { display: grid; grid-template-columns: minmax(150px, max-content) minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 8px 12px; background: var(--panel); border: 2px solid var(--line); }
.cmd code { font: 14px/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--accent); overflow-wrap: anywhere; }
.cmd button { background: var(--panel-2); color: var(--muted); border: 2px solid var(--line); font: 12px var(--font-display); padding: 4px 8px; cursor: pointer; }
.cmd button:hover { color: var(--fg); }
.home { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.tile { display: grid; gap: 10px; padding: 16px; background: var(--panel); border: 2px solid var(--line); text-decoration: none; min-width: 0; transition: transform .12s, border-color .12s; }
.tile:hover { border-color: var(--accent); transform: translateY(-2px); }
.tile .top { display: flex; gap: 12px; align-items: center; }
.tile p { margin: 0; color: var(--muted); font-size: 14px; }
.tile .count { font: 13px var(--font-display); color: var(--muted); letter-spacing: .05em; }
.empty { color: var(--muted); padding: 10px 0; }
.status { color: var(--muted); }
@media (max-width: 800px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 5; border-right: 0; border-bottom: 2px solid var(--line); padding-block: 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
  .brand { margin-bottom: 10px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .nav a { white-space: nowrap; padding: 6px 8px; font-size: 15px; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-block: 20px 48px; }
  .cmd { grid-template-columns: minmax(0, 1fr) auto; }
  .cmd span { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile:hover { transform: none; } }
</style>

<div class="shell">
  <aside class="rail">
    <a class="brand" href="#">
      <span class="mark" aria-hidden="true"></span>
      <span><b>Moggers</b><small>справочник сервера</small></span>
    </a>
    <ul class="nav" id="nav"></ul>
  </aside>
  <main class="main"><div class="wrap" id="view"><p class="status">Загружаем справочник…</p></div></main>
</div>

<script>
const view = document.getElementById("view");
const nav = document.getElementById("nav");
let sections = [];

const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value == null) continue;
    if (key === "class") node.className = value; else node.setAttribute(key, value);
  }
  for (const kid of kids.flat()) if (kid != null) node.append(kid);
  return node;
};
const slot = (icon, size) => {
  const box = el("span", { class: "slot", "aria-hidden": "true" });
  if (size) { box.style.width = box.style.height = size + "px"; }
  if (icon) box.append(el("img", { src: icon, alt: "" }));
  return box;
};
const cellText = (value) => typeof value === "string" ? value : value.text;

function renderCell(value) {
  if (typeof value === "string") return value;
  const text = el("span", {}, value.text, value.note ? el("span", { class: "cellnote" }, value.note) : null);
  return value.icon ? el("span", { class: "cellbox" }, slot(value.icon), text) : text;
}

const renderers = {
  text: (block) => block.paragraphs.map((p) => el("p", {}, p)),
  steps: (block) => el("ol", { class: "steps" }, block.items.map((item) => el("li", {}, el("span", {}, item)))),
  table: (block) => el("div", { class: "table-box" },
    el("table", {},
      el("thead", {}, el("tr", {}, block.columns.map((c) => el("th", { scope: "col" }, c)))),
      el("tbody", {}, block.rows.map((row) => el("tr", { "data-search": row.map(cellText).join(" ").toLowerCase() },
        row.map((value) => el("td", {}, renderCell(value)))))))),
  grid: (block) => el("div", { class: "grid" }, block.items.map((item) => el("article", { class: "card", "data-search": [item.title, item.subtitle, ...(item.lines || [])].join(" ").toLowerCase() },
    item.image ? el("figure", {}, el("img", { src: item.image.startsWith("data:") ? item.image : "assets/" + item.image, alt: item.title, loading: "lazy" })) : el("div"),
    el("div", { class: "body" },
      el("div", { class: "top" }, item.icon ? slot(item.icon, 30) : null, el("h3", {}, item.title)),
      item.subtitle ? el("div", { class: "sub" }, item.subtitle) : null,
      item.lines && item.lines.length ? el("ul", {}, item.lines.map((line) => el("li", {}, line))) : null)))),
  commands: (block) => el("div", { class: "cmds" }, block.items.map((item) => {
    const copy = el("button", { type: "button" }, "копировать");
    copy.addEventListener("click", () => {
      navigator.clipboard?.writeText(item.cmd).then(() => { copy.textContent = "скопировано"; setTimeout(() => copy.textContent = "копировать", 1400); })
        .catch(() => { const range = document.createRange(); range.selectNodeContents(code); getSelection().removeAllRanges(); getSelection().addRange(range); });
    });
    const code = el("code", {}, item.cmd);
    return el("div", { class: "cmd", "data-search": (item.cmd + " " + item.desc).toLowerCase() }, code, el("span", {}, item.desc), copy);
  })),
};

function countRows(section) {
  return section.blocks.reduce((n, b) => n + (b.kind === "table" ? b.rows.length : 0), 0);
}

function renderHome() {
  view.replaceChildren(
    el("div", { class: "head" }, el("div", { class: "titles" },
      el("span", { class: "eyebrow" }, "Moggers · 26.3"),
      el("h1", {}, "Справочник сервера"),
      el("p", { class: "lead" }, "Всё основное об игровых плагинах сервера: с чего начать, что можно сделать и какие команды пригодятся."))),
    el("div", { class: "home" }, sections.map((s) => el("a", { class: "tile", href: "#" + s.id },
      el("div", { class: "top" }, slot(s.icon), el("h2", {}, s.title)),
      el("p", {}, s.summary),
      countRows(s) ? el("span", { class: "count" }, "записей в таблицах: " + countRows(s)) : null))));
}

function renderSection(section) {
  const search = el("input", { id: "search", type: "search", placeholder: "Найти в разделе", "aria-label": "Найти в разделе" });
  const blocks = section.blocks.map((block) => {
    const body = renderers[block.kind](block);
    return el("section", { class: "block", "data-kind": block.kind },
      el("h2", {}, block.title), body, block.note ? el("p", { class: "note" }, block.note) : null);
  });
  const empty = el("p", { class: "empty", hidden: "" }, "В этом разделе ничего не нашлось.");
  view.replaceChildren(
    el("div", { class: "head" },
      el("div", { class: "titles" }, el("span", { class: "eyebrow" }, section.plugin || "Moggers"), el("h1", {}, section.title), el("p", { class: "lead" }, section.summary)),
      el("label", { class: "search" }, search)),
    el("div", { class: "blocks" }, blocks, empty));
  search.addEventListener("input", () => {
    const query = search.value.trim().toLowerCase();
    let shown = 0;
    for (const block of blocks) {
      const items = block.querySelectorAll("[data-search]");
      if (!items.length) { block.hidden = !!query; continue; }
      let any = 0;
      for (const item of items) { const hit = !query || item.dataset.search.includes(query); item.hidden = !hit; any += hit; }
      block.hidden = !any; shown += any;
    }
    empty.hidden = !query || shown > 0;
  });
}

function route() {
  const id = location.hash.slice(1);
  const section = sections.find((s) => s.id === id);
  for (const link of nav.querySelectorAll("a")) link.toggleAttribute("aria-current", link.getAttribute("href") === "#" + id);
  for (const link of nav.querySelectorAll("a[aria-current]")) link.setAttribute("aria-current", "page");
  section ? renderSection(section) : renderHome();
  window.scrollTo(0, 0);
}

fetch("data.json").then((r) => r.json()).then((data) => {
  sections = data.sections;
  nav.replaceChildren(...sections.map((s) => el("li", {}, el("a", { href: "#" + s.id }, slot(s.icon, 26), s.title))));
  route();
}).catch(() => { view.replaceChildren(el("p", { class: "status" }, "Не удалось загрузить данные справочника. Обновите страницу.")); });
addEventListener("hashchange", route);
</script>
